# The machine's canon — the one source of everything the machine
# prints. The contract's base is English and the English text rules;
# the Russian and Chinese mirrors are generated data for the humans
# who read those languages. The zone's contract.md, template.yaml and
# the mirrors are generated from this file; the parity map binds
# every validation rule to the law the contract prints; the
# environment rule names the exact set a command sees. A canon that
# would lie about the machine fails the build (the self-validation
# battery runs the example against the real machine).
contract: |
  punchtape — the contract

  You just ran punchtape and it printed this page: there is no
  instance in this directory yet. Nothing exists and nothing was
  created. TO START: create the file .punchtape/wish.md with the
  human's wish copied verbatim into it, and run punchtape again —
  that run births the instance, fixes the goal forever and writes
  the zone's standing files.

  THE CALL, always. One call, no arguments, ever: `punchtape`. The
  terminal gets exactly one line — the next action to take, named
  with the file to touch. Every further answer is a file of this
  zone: state.md holds the standing and the next: instruction,
  report.md holds the last run's facts.

  THE CYCLE, after the birth. Submit a document → its rows run →
  fix code or rows until green → copy corpus.yaml byte-for-byte
  into inbox.yaml and run: that submission is the completion act,
  the machine records the verdict. state.md then shows the verdict
  and any drift since. At every point the terminal line and
  state.md's next: line say exactly what to do now.

  law:wish      The human's wish, verbatim, into .punchtape/wish.md.
                The next run births the instance and fixes the goal
                forever; the slot is dead after the birth. No wish —
                no birth, nothing else ever creates the instance.
                At the birth the machine numbers every non-empty
                wish line W1..Wm in file order, and the numbers are
                fixed forever: the wish's bytes never change again.

  law:document  All work is one document (the shape is below). Copy
                template.yaml, edit, submit as .punchtape/inbox.yaml.
                A submission MERGES by id: each listed behavior is
                added, or its head replaces the standing one's and
                its rows merge by run — the same run replaces the
                whole row, a new run is appended, unlisted rows
                stand. Requirements merge by id the same way; a
                carried not-a-requirement list or artifacts list
                replaces the standing one whole. What is not listed
                stands untouched; a subset of behaviors is a normal
                submission. The number of submissions does not
                affect the price: the listed bytes travel once,
                unchanged rows are not re-sent. Removal is only an
                explicit remove list of standing ids — behaviors or
                requirements; retiring a requirement demands the
                same submission clear every cover of it. notes are
                free text, never interpreted.

                The registry accounts for the wish: requirements
                name the brief lines they occupy as W ranges;
                behaviors name the requirements they prove in
                covers; lines that demand nothing are marked
                not-a-requirement — the lines' own words quoted
                verbatim beside a reason; artifacts declare the
                work's outputs. Every row carries an explicit
                expect — rc, out or files — and every behavior
                carries at least one row: rows are all a behavior
                proves.

  law:paths     Every path — expect files, scope globs, artifacts —
                is relative to the working root. Absolute, "..", or
                escaping spellings are refused.

  law:done      Submitting the corpus's own bytes (corpus.yaml
                copied into inbox.yaml unchanged) is the completion
                act that records the verdict. The verdict needs
                every row green on the current fingerprints, the
                wish whole — every W line inside some requirement's
                span or marked not-a-requirement —, every standing
                requirement named in the covers of a standing
                behavior that carries rows, and no uncovered source
                file; declared artifacts are the document's signed
                outputs. The wish's size decides the corpus's size
                — not taste. Anything short means "not yet" —
                report.md names the holes.

  law:your-tree Rows and the build run in your working tree, from
                its root, with the PATH and HOME of the shell that
                runs the machine, plus the zone's pin file
                .punchtape/env when it carries one (one KEY=VALUE a
                line, the key [A-Za-z_][A-Za-z0-9_]*, no export, no
                quotes, no absolute paths — a pin travels with the
                tree; a line of any other shape is refused loud) —
                nothing else is passed. Call what your project needs
                by explicit relative path (./tool, bin/helper) and
                put such files into
                the behavior's scope. The build, when declared, runs
                FIRST; its failure stops the rows this run. Clean up
                inside the commands themselves: files left behind
                change the tree.

  SCOPE — what a row depends on. Each behavior's scope lists its
  files as root-relative globs ("**" crosses directories). A row
  re-runs when: its bytes changed, its behavior's scope files
  changed, the environment changed, or it never ran. Unchanged scope
  — the row never runs again. A behavior with rows and NO scope
  re-runs every run: always give rows a scope. Files covered by no
  scope are split in state.md: those the document's artifacts
  declare stand under "artifacts (declared)", the rest are
  uncovered sources — cover them with a scope or declare them, or
  they hold the verdict.

  The tree's version-control bookkeeping directories (.git, .hg,
  .svn) are the tree's own machinery, not sources: they stand
  outside every scope and never hold the verdict.

  REFUSALS. A refused submission stays in inbox.yaml — the document's
  bytes write nothing; the machine journals the refusal as its own
  fact and state.md counts it. report.md names the field, the fact
  and the law id. Fix the named place in the same file and run
  again — a refusal costs one run, nothing is lost. Red rows stand in report.md
  grouped by reason.

  THE DOCUMENT'S SHAPE (copy template.yaml and edit):

    notes: [{text: a free-text note}]
    build: "./build all"
    remove: [old/thing, R2]
    requirements:
      - id: R1                 # R then letters, digits, dots
        brief: [W1..W4, W9]    # the wish lines this requirement occupies
    not-a-requirement:
      - lines: [W5]
        quote: "a heading"     # the marked lines' own text, verbatim
        reason: a heading, not a demand
    artifacts: [out/**]        # the work's declared outputs
    behaviors:
      - id: tool/build         # [a-z0-9-] segments joined by /
        name: one line
        prose: what the user gets and why
        scope: [src/**]        # the behavior's files, globs from the root
        covers: [R1]           # the requirements this behavior proves
        rows:
          - run: "./tool src out"
            expect: {rc: 0, out: "contains: ok",
                     files: {out/built.txt: "contains: done"}}

  Every expect field is optional, but at least one of rc, out,
  files must stand — an empty expect is refused; rc absent wants 0;
  a value with the "contains: " prefix matches a substring, without
  it — the exact bytes. run is one command: a shell line or an argv
  list. W ranges are W<n> or W<a>..W<b>, ascending, comma-joined —
  they name the wish's numbered lines and nothing else.

  ZONE FILES. contract.md (this page; contract-ru.md, contract-zh.md
  are its mirrors) template.yaml | wish.md inbox.yaml — you write |
  corpus.yaml the standing corpus | state.md standing, drift, the
  brief map, next step | report.md the last run or the refusals |
  knowledge.md notes and lessons | spec/ one page per behavior |
  journal/ the record stream — never edit | cache/ tmp/ the machine's own.
  One record stands outside the zone: the working root's AGENTS.md
  carries the machine's marked block (its discovery hook), kept whole
  by every run; bytes outside the block are never touched.

contract-ru: |
  Зеркало contract.md; закон — английский текст.

  punchtape — контракт

  Ты только что запустил punchtape — и он напечатал эту страницу:
  в этом каталоге ещё НЕТ инстанса. Ничего не существует и ничего
  не создано. ЧТОБЫ НАЧАТЬ: создай файл .punchtape/wish.md и положи
  в него желание человека дословно, затем запусти punchtape снова —
  этот запуск родит инстанс, навсегда зафиксирует цель и запишет
  стоящие файлы зоны.

  ВЫЗОВ, всегда. Один вызов, без аргументов: `punchtape`. Терминал
  получает ровно одну строку — следующее действие с именем файла,
  которого оно касается. Всякий дальнейший ответ — файл этой зоны:
  state.md держит стоящее и инструкцию next:, report.md — факты
  последнего прогона.

  ЦИКЛ, после рождения. Подай документ → его строки исполнятся →
  чини код или строки до зелёного → скопируй corpus.yaml байт-в-байт
  в inbox.yaml и запусти: эта подача — акт завершения, машина
  записывает вердикт. После state.md показывает вердикт и любой
  дрейф с него. В каждой точке строка терминала и next: в state.md
  говорят ровно то, что делать сейчас.

  law:wish      Желание человека, дословно, в .punchtape/wish.md.
                Следующий запуск рождает инстанс и фиксирует цель
                навсегда; слот мёртв после рождения. Нет желания —
                нет рождения; ничего другое инстанс никогда не
                создаёт. При рождении машина нумерует каждую
                непустую строку желания W1..Wm по порядку файла —
                номера фиксированы навсегда: байты желания больше
                не меняются.

  law:document  Вся работа — один документ (форма ниже). Скопируй
                template.yaml, отредактируй, подай как
                .punchtape/inbox.yaml. Подача СЛИВАЕТСЯ по id:
                перечисленное поведение добавляется, или его голова
                заменяет стоящую, а его строки сливаются по run —
                тот же run заменяется ЦЕЛОЙ строкой, новый run
                дописывается, непоименованные строки стоят.
                Требования сливаются по id так же; поданный список
                not-a-requirement или artifacts заменяет стоящий
                целиком. Неперечисленное стоит нетронутым;
                подмножество поведений — нормальная подача. Число
                подач не влияет на цену: перечисленные байты едут
                один раз, неизменённые строки не переотправляются.
                Удаление — только явный remove-список существующих
                id — поведений или требований; увольнение
                требования обязывает ту же подачу снять все covers
                на него. notes — свободный текст, никогда не
                интерпретируется.

                Реестр учитывает желание: требования называют
                занимаемые строки брифа W-диапазонами; поведения
                называют доказываемые требования в covers; строки,
                которые ничего не требуют, помечаются
                not-a-requirement — собственные слова строки
                цитируются дословно рядом с причиной; artifacts
                объявляют выходы работы. Каждая строка несёт явный expect —
                rc, out или files — и каждое поведение несёт хотя
                бы одну строку: строки — всё, что поведение
                доказывает.

  law:paths     Каждый путь — expect-файлы, глобы scope, artifacts —
                относительно рабочего корня. Абсолютные, «..» и
                убегающие написания отвергаются.

  law:done      Подача байт самого корпуса (corpus.yaml, скопированный
                в inbox.yaml без изменений) — акт завершения,
                записывающий вердикт. Вердикт требует: каждая строка
                зелёная на текущих отпечатках; желание учтено
                целиком — каждая W-строка внутри диапазона
                некоторого требования или помечена
                not-a-requirement —; каждое стоящее требование
                названо в covers стоящего поведения, несущего
                строки; и ни одного непокрытого исходника;
                объявленные артефакты — подписанные выходы
                документа. Размер корпуса решает размер желания —
                не вкус. Всё, что меньше, значит «ещё нет» —
                report.md называет дыры.

  law:your-tree Строки и сборка исполняются в твоём рабочем дереве,
                от его корня, с PATH и HOME шелла, запустившего
                машину, а сверх них — с файлом закреплений зоны
                .punchtape/env, если он есть (по одному KEY=VALUE в
                строке, ключ [A-Za-z_][A-Za-z0-9_]*, без export,
                без кавычек, без абсолютных путей — закрепление
                путешествует с деревом; строка иной формы
                отвергается громко), — больше ничего не передаётся.
                Зови нужное проекту явным относительным путём
                (./tool, bin/helper) и включай такие файлы
                в скоуп поведения. Сборка, если объявлена, идёт
                ПЕРВОЙ; её отказ останавливает строки этого
                прогона. Убирай за собой в самих командах:
                оставленные файлы меняют дерево.

  СКОУП — от чего зависит строка. Скоуп поведения перечисляет его
  файлы глобами от корня («**» пересекает каталоги). Строка
  перезапускается, если: изменились её байты, изменились файлы
  скоупа её поведения, изменилась среда или она никогда не
  исполнялась. Неизменный скоуп — строка больше не исполняется
  никогда. Поведение со строками БЕЗ скоупа перезапускается каждый
  прогон: строкам всегда нужен скоуп. Файлы вне всех скоупов
  делятся в state.md: объявленные артефактами документа стоят под
  «artifacts (declared)», остальные — непокрытые исходники —
  покрой их скоупом или объяви, иначе они держат вердикт.

  Служебные каталоги учёта версий дерева (.git, .hg, .svn) —
  механизм самого дерева, не исходники: они вне всякого скоупа
  и никогда не держат вердикт.

  ОТКАЗЫ. Отказанная подача остаётся в inbox.yaml — байты документа
  не пишутся ничего; сама машина журналирует отказ как собственный
  факт, state.md его считает. report.md называет поле, факт и id
  закона. Почини названное место в том же файле и запусти снова —
  отказ стоит один прогон, ничего не теряется. Красные строки стоят в report.md, сгруппированы по
  причинам.

  ФОРМА ДОКУМЕНТА (скопируй template.yaml и правь):

    notes: [{text: свободный текст}]
    build: "./build all"
    remove: [old/thing, R2]
    requirements:
      - id: R1                 # R, затем буквы, цифры и точки
        brief: [W1..W4, W9]    # строки желания, которые занимает требование
    not-a-requirement:
      - lines: [W5]
        quote: "заголовок"      # собственный текст помеченных строк, дословно
        reason: заголовок, а не требование
    artifacts: [out/**]        # объявленные выходы работы
    behaviors:
      - id: tool/build         # сегменты [a-z0-9-] через /
        name: одна строка
        prose: что получает пользователь и почему
        scope: [src/**]        # файлы поведения, глобы от корня
        covers: [R1]           # требования, которые доказывает поведение
        rows:
          - run: "./tool src out"
            expect: {rc: 0, out: "contains: ok",
                     files: {out/built.txt: "contains: done"}}

  Каждое поле expect необязательно, но хотя бы одно из rc, out,
  files обязано стоять — пустой expect отвергается; rc отсутствует =
  ожидается 0; значение с префиксом «contains: » матчит подстроку,
  без него — точные байты. run — одна команда: строка оболочки или
  argv-список. W-диапазоны — W<n> или W<a>..W<b>, по возрастанию,
  через запятую — они именуют нумерованные строки желания и ничего
  другое.

  ФАЙЛЫ ЗОНЫ. contract.md (эта страница; contract-ru.md,
  contract-zh.md — её зеркала) template.yaml | wish.md inbox.yaml —
  пишешь ты | corpus.yaml стоящий корпус | state.md состояние,
  дрейф, карта брифа, следующий шаг | report.md последний прогон
  или отказы | knowledge.md заметки и уроки | spec/ страница на
  каждое поведение | journal/ поток записей — не редактировать никогда |
  cache/ tmp/ — принадлежат машине.
  Одна запись стоит вне зоны: AGENTS.md рабочего корня несёт
  помеченный блок машины (её крючок обнаружения), поддерживаемый
  целым каждым запуском; байты вне блока не трогаются никогда.

contract-zh: |
  contract.md 的镜像；以英文原文为准。

  punchtape — 契约

  你刚刚运行了 punchtape，它打印了本页：此目录中还没有实例。
  什么都不存在，也没有创建任何东西。如何开始：创建文件
  .punchtape/wish.md，把人类的愿望逐字放入其中，然后再次运行
  punchtape——那次运行诞生实例、永远固定目标并写出本区的现行
  文件。

  调用，永远。只有一次调用，无参数：`punchtape`。终端只收到
  一行——即下一步该做什么，并点名要动的文件。此后的每个答案
  都在本区文件里：state.md 载有现状与 next: 指令，report.md 载
  有最近一次运行的事实。

  循环，诞生之后。提交文档 → 其行执行 → 修代码或修行直到
  全绿 → 把 corpus.yaml 逐字节复制为 inbox.yaml 并运行：这次提交
  即完成动作，机器记录裁决。此后 state.md 显示裁决与其后的一切
  漂移。在每一个节点，终端行与 state.md 的 next: 行都明确说明
  现在该做什么。

  law:wish      人类的愿望逐字写入 .punchtape/wish.md。下一次运行
                诞生实例并永远固定目标；该槽位在诞生后即告失效。
                没有愿望就没有诞生；没有任何别的东西会创建实例。
                诞生时机器按文件顺序为愿望的每一非空行编号
                W1..Wm——号码永远固定：愿望的字节不再改变。

  law:document  全部工作只有一个文档（形状见下）。复制
                template.yaml，编辑，作为 .punchtape/inbox.yaml
                提交。提交按 id 合并：所列行为被新增，或其头部
                替换现行者而其行按 run 合并——同一 run 整行替换，
                新 run 追加，未列出的行保持原样。要求按 id 同样
                合并；提交携带的 not-a-requirement 列表或
                artifacts 列表整体替换现行列表。未列出者原样
                保留；提交行为的子集是正常提交。提交次数不影响
                价格：所列字节只走一次，未改动的行不再重发。
                删除只能是显式的 remove 列出现存 id——行为或
                要求；退订一条要求时，同一提交必须撤下对它的
                全部 covers。notes 为自由文本，永不被解释。

                登记簿为愿望记账：要求以 W 区间点名所占的简报
                行；行为在 covers 中点名自己证明的要求；不提出
                要求的行以 not-a-requirement 标注——逐字引用
                该行自己的文字，旁附理由；artifacts 声明工作的
                产出。每一行都携带显式
                expect——rc、out 或 files——且每个行为至少带
                一行：行为证明的一切就是行。

  law:paths     一切路径——expect 文件、scope 通配、artifacts——
                都相对工作根。绝对路径、「..」与越界写法一律
                拒绝。

  law:done      提交语料自身的字节（corpus.yaml 原样复制为
                inbox.yaml）即记录裁决的完成动作。裁决需要：
                每一行在当前指纹下全为绿；愿望完整——每一
                W 行都在某要求的区间之内或被标注
                not-a-requirement——；每一现存要求都被某个带行
                的现存行为的 covers 点名；并且没有未覆盖的源
                文件；声明的 artifacts 是文档签署的产出。语料
                的大小由愿望的大小决定——而非口味。任何不足都
                意味着「尚未」——report.md 点名缺口。

  law:your-tree 行与构建在你的工作树中、从其根目录、带运行本机
                器之 shell 的 PATH 与 HOME，外加区域固定文件
                .punchtape/env（若存在；每行一条 KEY=VALUE，键为
                [A-Za-z_][A-Za-z0-9_]*，禁 export、禁引号、禁绝
                对路径——固定随树而行；他形之行将被高声拒绝）运行
                ——不传其它任何东西。
                项目所需之物以显式相对路径调用（./tool、bin/helper），
                并把此类文件放进该行为的 scope。构建一经
                声明便最先运行；其失败使本次运行的行全部停止。
                在命令内部自行清理：遗留的文件会改变树。

  SCOPE——行依赖什么。每个行为的 scope 以从根起的通配列出其文件
  （「**」跨越目录）。一行重新执行，当：其字节变了、其行为 scope
  的文件变了、环境变了、或它从未执行过。scope 未变——该行永不再
  执行。有行而无 scope 的行为每次运行都重跑：行必须始终有 scope。
  不被任何 scope 覆盖的文件在 state.md 中分列：文档 artifacts
  声明的立在「artifacts (declared)」之下，其余是未覆盖源文件——
  用 scope 覆盖它们或加以声明，否则它们挡住裁决。

  树的版本控制簿记目录（.git、.hg、.svn）是树自身的机制，
  不是源文件：它们立于一切 scope 之外，永不阻挡裁决。

  拒绝。被拒的提交留在 inbox.yaml——文档的字节一概不写；机器
  把拒绝本身作为自己的事实记入日志，state.md 对其计数。
  report.md 点名字段、事实与法律 id。在同一文件里修好被点名
  之处再运行——拒绝的代价是一次运行，毫无损失。红行按原因分组列于 report.md。

  文档的形状（复制 template.yaml 并编辑）：

    notes: [{text: 自由文本}]
    build: "./build all"
    remove: [old/thing, R2]
    requirements:
      - id: R1                 # R 后接字母、数字与点
        brief: [W1..W4, W9]    # 该要求占据的愿望行
    not-a-requirement:
      - lines: [W5]
        quote: "标题"           # 所标各行自己的文字，逐字
        reason: 标题，不是要求
    artifacts: [out/**]        # 工作声明的产出
    behaviors:
      - id: tool/build         # [a-z0-9-] 段，以 / 相连
        name: 一行
        prose: 用户得到什么，为何如此
        scope: [src/**]        # 该行为的文件，从工作根起的通配
        covers: [R1]           # 该行为证明的要求
        rows:
          - run: "./tool src out"
            expect: {rc: 0, out: "contains: ok",
                     files: {out/built.txt: "contains: done"}}

  expect 的每个字段都可省略，但 rc、out、files 至少要有其一
  ——空的 expect 被拒绝；rc 缺省即要求 0；带「contains: 」前缀
  的值匹配子串，不带则匹配精确字节。run 是一条命令：shell 行
  或 argv 列表。W 区间为 W<n> 或 W<a>..W<b>，须递增，以逗号
  相连——它们只点名愿望的编号行。

  区文件。contract.md（本页；contract-ru.md、contract-zh.md 为其
  镜像）template.yaml | wish.md inbox.yaml——由你写入 |
  corpus.yaml 现行语料 | state.md 状态、漂移、简报地图、下一步 |
  report.md 最近运行或拒绝 | knowledge.md 笔记与教训 | spec/
  每个行为一页 | journal/ 记录流——永不手改 | cache/ tmp/ 机器
  自有。一条记录立于区外：工作根的 AGENTS.md 载有机器的标记
  块（其发现钩子），每次运行都将其保持完整；块外的字节永不
  触碰。

template: |
  # The document: copy me, edit, submit as .punchtape/inbox.yaml.
  # The behaviors listed are added or merged by id; removal is the
  # remove list of standing ids. Paths are relative to the working root.
  # Rows merge by run — send only the changed rows: the same run
  # replaces its whole row, the rest stand.
  notes:
    - text: a free-text note; a longer note continues
        on the next line, indented deeper than its key
  # build: "./build all"   # one build command; uncomment and edit if needed
  remove: []
  # requirements:
  #   - id: R1             # R then letters, digits, dots
  #     brief: [W1..W3]    # the wish lines this requirement occupies
  # not-a-requirement:
  #   - lines: [W4]
  #     quote: a heading   # the marked lines' own text, verbatim
  #     reason: a heading, not a demand
  # artifacts: [out/**]    # the work's declared outputs
  behaviors:
    - id: tool/first   # [a-z0-9-] segments joined by /
      name: one line
      prose: what the user gets and why
      scope: [src/**]  # the behavior's files, globs from the root
      # covers: [R1]   # the requirements this behavior proves
      rows:
        - run: "./tool src out"   # one command: a shell line or an argv list
          expect:                 # at least one of rc, out, files must stand
            rc: 0
            out: "contains: ok"
            files: { out/built.txt: "contains: done" }
# The example must pass validation and run green in a fixture — the
# self-validation of the canon (a canon that lies fails the build).
example: |
  notes:
    - text: the honest check of the one call
  requirements:
    - id: R1
      brief: [W2]
    - id: R2
      brief: [W3]
  not-a-requirement:
    - lines: [W1]
      quote: a counter
      reason: the wish's title names the work, it demands nothing
  artifacts: [ex.txt]
  behaviors:
    - id: tool/example
      name: The example
      prose: "What the user gets: a written file, checked by its bytes."
      scope:
        - ex.txt
      covers: [R1, R2]
      rows:
        - run: printf 'ok' > ex.txt
          expect:
            rc: 0
            files:
              ex.txt: "contains: ok"
# Every validation rule of the document, bound to the law the
# contract prints. The parity gate reads this map: everything
# enforced is printed, everything printed is enforced.
law-map:
  - rule: one document kind, unknown fields refused
    law: law:document
  - rule: ids are [a-z0-9-] path segments, unique in a submission
    law: law:document
  - rule: submission merges by id; remove lists standing ids only
    law: law:document
  - rule: runs are unique in one behavior; rows merge by run
    law: law:document
  - rule: expect file paths and scope globs are root-relative
    law: law:paths
  - rule: the build command is a string when present
    law: law:document
  - rule: the wish's non-empty lines number W1..Wm at the birth, fixed forever
    law: law:wish
  - rule: requirement ids are R then letters, digits and dots, unique in a submission
    law: law:document
  - rule: brief and marker ranges parse in the W grammar and name wish lines
    law: law:document
  - rule: covers name requirements that stand after the submission's merge
    law: law:document
  - rule: a removed requirement leaves no cover behind in the same submission
    law: law:document
  - rule: marker reasons are non-empty; marker quotes are the wish's own lines verbatim
    law: law:document
  - rule: artifact globs are root-relative
    law: law:paths
  - rule: every row carries rc, out or files; every behavior carries at least one row
    law: law:document
  - rule: the verdict needs the wish whole, every requirement covered, no uncovered source
    law: law:done
# The environment rule: the exact names a command sees, nothing else.
env: [PATH, HOME]
