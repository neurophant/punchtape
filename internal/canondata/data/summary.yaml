# SUMMARY.md — a human-readable one-page verdict summary: four mandatory
# blocks — made/checked/remaining/price; the machine protocol stays
# English. The render is computed from the state, the ledger and the
# canon, written at verdict freeze next to SPEC.md.
summary.title: "# Summary"
summary.made.head: "## Made"
summary.made.composition: "- composition: {reqs} requirements, {scenarios} scenarios ({prose} prose), {cards} cards"
summary.made.flow: "- flow: {submitted} submissions accepted, {runs} machine runs"
summary.made.verdict: "- verdict: {status}"
summary.checked.head: "## Checked"
summary.checked.checks: "- checks: {green} green, {red} red of {total}"
summary.checked.trace: "- traceability: {green} of {executable} executable scenarios linked to green checks"
summary.checked.acceptance: "- acceptance: {line}"
summary.remaining.head: "## Remaining"
summary.remaining.none: "- nothing remains: no taste queue, no quarantine"
summary.remaining.taste: "- taste queue: {items}"
summary.remaining.quarantine: "- quarantine: {items}"
summary.derived.not-run: "not run"
summary.derived.none: "none"
summary.acceptance.not-run: "not run"
summary.acceptance.pass: "PASS on {digest} ({green}/{total})"
summary.acceptance.fail: "FAIL on {digest} ({green}/{total} green)"
summary.acceptance.env: "environment broke the probe: {diag}"
summary.acceptance.drift: "SURFACE DRIFTED since the acceptance ({old} → {new})"
summary.remaining.pending: "- pending amendment: {count} change(s) await the human"
summary.checked.derived: "- derived: {line}"
summary.remaining.more: "{count} in total — the verdict lists every item"
summary.price.head: "## Price"
summary.stage.intake: "intake"
summary.stage.spec: "spec"
summary.stage.ac-compile: "acceptance compile"
summary.stage.implement: "code"
summary.stage.review: "review"
summary.stage.deliver: "delivery"

# The wish in the summary — in full (truncating to the first line cut the
# thought); platform tokens not reported — those lines stay silent, no
# "no data" listing.
summary.made.wish-head: "The wish (verbatim):"
summary.made.wish-none: "- wish: not pinned yet"
summary.derived.line: "{total} variants (budget {budget} per scenario): {green} green, {red} red — informational probes of the same checks, not the spec"
summary.price.stage: "- {stage}: {wall}, tokens {tokens}"
summary.price.stage-notokens: "- {stage}: {wall}"
summary.price.total: "- total: {wall}, tokens {tokens}, verb calls {calls}"
summary.price.total-notokens: "- total: {wall}, verb calls {calls}"

