# CHANGELOG.md — the machine render of "what changed and why" from the
# machine journal: one line per applied change; the journal is the single
# truth, the render is a derivative. Written at verdict freeze next to
# SPEC.md.
changelog.title: "# Changelog"
changelog.head: "Every applied change of this instance, machine-journaled; the why of each is its kind."
changelog.entry: "- {time} — {what} ({key}): {effects}"
changelog.effects: "{touched} files touched, {removed} removed"
changelog.effects.none: "state only"
changelog.kind.intent: "wish pinned"
changelog.kind.spec: "spec changed"
changelog.kind.checks: "check table changed"
changelog.kind.code: "code submitted"
changelog.kind.fix: "code fixed"
changelog.kind.conventions: "environment recipe learned"
changelog.kind.amend: "human assertion applied"
changelog.kind.decision: "decision recorded"
changelog.kind.split: "cards split"
changelog.kind.assert: "assertions pinned"
changelog.kind.waive: "gap waived"
changelog.kind.kb: "knowledge recorded"
changelog.kind.run: "machine verification run"
verdict.changelog: "changelog: {count} changes → .punchtape/CHANGELOG.md"

# A held submission: recorded but not applied — awaits a human assertion
# (kind: amend); the render does not present it as an accomplished fact.
changelog.held: " (held for human assertion — not applied yet)"

