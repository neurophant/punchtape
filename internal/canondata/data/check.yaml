# Check surfaces: reasons for a red run, divergences between two clean
# runs, and observation capture errors.
check.fail.not-transient: "not transient: {diff} — the same sequence from the same seed differs between two clean runs; unpredictable bytes the wish itself causes: declare volatile on the row BEFORE its first run, or normalize inside the row (rewrite them in place, sort events, write logs outside the run dir)"
check.fail.run-dir: "run dir: {err}"
check.fail.run-lock: "run lock: {err}"
check.fail.snapshot-budget: "snapshot: {path} exceeds the {max}-byte budget of the run-dir snapshot"
check.fail.no-surface: "no surface call"
check.fail.setup: "setup `{command}`: {reason} (argv: [{argv}])"
check.fail.setup-exit: "setup `{command}`: exited {exit}, expected 0 — argv: [{argv}] — the state-building prefix of the row must succeed (each run element is a separate command)"
check.fail.observed: "{reason} [ran `{command}`, exit {exit}, stdout: {stdout}, stderr: {stderr}]"
check.diff.exit: "exit {first} vs {second}"
check.diff.stdout: "stdout differs ({diff})"
check.diff.stderr: "stderr differs ({diff})"
check.diff.files-count: "files differ: {first} vs {second}"
check.diff.file-one-run: "file {path} present in one run only"
check.diff.file-differs: "file {path} differs"
check.error.capture-empty: "capture: empty command"
check.assert.file-missing: "file {path}: does not exist"
check.assert.file-exists: "file {path}: exists"
check.assert.observation-unknown: "observation {observation}: unknown"
check.assert.not-contains: "{observation} does not contain {value} (actual: {actual})"
check.assert.not-empty: "{observation} is not empty (actual: {actual})"
check.assert.zero: "{observation} is 0 — expected a failure"
check.assert.not-equal: "{observation} is not equal to {value} (actual: {actual}; {diff})"
check.assert.bytes-differ: "file {path}: bytes differ from the pinned literal (actual: {actual}; {diff})"
check.assert.condition-unknown: "condition {condition}: unknown"
check.assert.json-want-invalid: "{observation} json-equals: value is not valid JSON ({err})"
check.assert.jsonc-want-invalid: "{observation} json-contains: value is not valid JSON ({err})"
check.assert.json-invalid: "{observation} is not valid JSON ({err}; actual: {actual})"
check.assert.json-not-equal: "{observation} json does not equal {want} (actual: {actual})"
check.assert.json-not-contains: "{observation} json does not contain {want} (actual: {actual})"
check.fail.seed: "seed {path}: {err}"
check.fail.material: "material {from}: {err}"
check.fail.start: "command `{command}` did not start: {err}"
check.fail.wait: "command `{command}` failed to be reaped: {err}"
