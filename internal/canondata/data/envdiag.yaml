- id: exec-not-found
  diagnosis: "the command is not installed in the environment: {command}"
  fix: install the tool into the environment or fix the row's command — rows run without a shell
- id: exec-permission
  diagnosis: "no permission to execute: {command}"
  fix: check the execute bit and ownership of the file the command points to
- id: command-timeout
  diagnosis: "timed out after {sec}s: {command}"
  fix: the command must finish within its timeout — a hang is a defect of the product or of the row's own orchestration
