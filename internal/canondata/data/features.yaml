features.status.draft: "draft"
features.status.accepted: "accepted"
features.status.realized: "delivered"
features.status.quarantine: "quarantined"
features.status.cancelled: "cancelled"
# Feature sections.
features.section.status: "Status: {status}"
features.section.depends: "Depends on: {ids}"
features.section.calls: "How it is called"
features.section.behavior: "Behavior"
features.section.boundaries: "Boundaries"
features.prose: "beyond machine measurement: {text} [{id}]"
# Boundary classes — living names; values are scenario addresses or a refusal reason.
features.detail.invariants: "invariants"
features.detail.edge-cases: "edge cases"
features.detail.failure-matrix: "failure behavior"
features.detail.concurrency: "concurrency"
features.detail.absent: "none — {reason}"
# Parts of a behavior line.
features.bullet.given: "given: {ops}"
features.bullet.pre: "after {commands}"
features.bullet.call: "call `{command}`"
# Observations in living words: what the user sees.
features.out.stdout.equals: "prints exactly: {value}"
