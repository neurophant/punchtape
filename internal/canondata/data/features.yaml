features.out.exit.ok: "finishes without errors"
features.out.exit.fail: "finishes with an error"
features.out.file.exists: "leaves the file {path}"
features.out.file.not-exists: "the file {path} stays absent"
features.out.file.absent: "the file {path} does not exist"
features.out.file.contains: "the file {path} contains: {value}"
features.out.file.equals: "the file {path} reads: {value}"
