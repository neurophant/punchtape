# The human specs of the instance (the .punchtape/specs directory): the
# shared index.md registry plus one file per feature — in living words,
# machine terms only as addresses.
features.toc.feature: "Feature"
features.toc.status: "Status"
features.toc.scenarios: "Scenarios"
