features.out.file.bytes-equals: "the file {path} is exactly: {value}"

# The spec registry (index.md) — the table of contents of the spec directory.
features.index.title: "Spec registry"
features.index.note: "One file per feature; the registry is regenerated by the machine on every verdict."
features.index.origin: "Origin — the wish"
features.index.address: "File"
features.index.doc: "Description"
# Statuses of the feature's author description.
features.doc.none: "no description yet"
features.doc.awaiting: "awaits operator review"
features.doc.ratified: "ratified by the operator"
features.doc.head: "What it does — in the author's words"

