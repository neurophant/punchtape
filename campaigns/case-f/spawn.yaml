# The campaign's single source of the spawn bytes — the exact texts
# every hand of the wave receives, {{INPUT}} being the hand's cell
# input directory. The machine knows none of these bytes; the texts
# only point at what each hand must find on its own. Besides the
# two standing texts, the scenario pairs carry the field cases: a
# wave names its pair by the `spawns` field (the key per hand kind).
machine: |
  Do the development through punchtape: run it with no arguments and
  follow the printed contract. Take the human's wish from `{{INPUT}}/brief.md`
  and put it verbatim into `.punchtape/wish.md`. All communication with
  the machine happens only through its zone's files. The work is complete
  when the machine has recorded a verdict.
solo: |
  The brief lives at `{{INPUT}}/brief.md` — the only input. Build the
  product from the brief right in the working directory. The report is
  the file `report.md`: every brief requirement and its status (done /
  partial / no) in your own words.
brimfield-machine: |
  Do the development through punchtape: run it with no arguments and
  follow the printed contract. A working product already stands in the
  working directory — do not write a new one: bring the standing one
  under the machine. Take the human's wish from `{{INPUT}}/brief.md`
  and put it verbatim into `.punchtape/wish.md`, then follow the
  contract to the verdict.
brimfield-solo: |
  The brief lives at `{{INPUT}}/brief.md` — the only input. The product
  already stands in the working directory; make every one of its
  behaviors proven by runs, and the document for the human — the spec —
  describe the standing code honestly. The report is the file
  `report.md`: every brief requirement and its status (done / partial /
  no) in your own words.
brimfeat-machine: |
  Do the development through punchtape: a working product and a live
  machine instance born on this brief stand in the working directory —
  the product's law is already proven by its corpus. Carry the human's
  wish from `{{INPUT}}/brief.md` into the corpus by new submissions
  under the printed contract. The work is complete when the machine
  has recorded a verdict over the grown corpus.
brimfeat-solo: |
  The brief lives at `{{INPUT}}/brief.md` — the only input. The product
  already stands in the working directory; deliver the brief's wish
  right in it. The report is the file `report.md`: every brief
  requirement and its status (done / partial / no) in your own words.
brimdrift-machine: |
  Do the development through punchtape: a working product and a live
  machine instance born on this brief stand in the working directory —
  the product's law is already proven by its corpus. Carry the human's
  wish from `{{INPUT}}/brief.md` into the corpus by new submissions
  under the printed contract. The work is complete when the machine
  has recorded a verdict over the grown corpus.
brimdrift-solo: |
  The brief lives at `{{INPUT}}/brief.md` — the only input. The product
  already stands in the working directory; deliver the brief's wish
  right in it. The report is the file `report.md`: every brief
  requirement and its status (done / partial / no) in your own words.
brimstack-machine: |
  Do the development through punchtape: a working product and a live
  machine instance stand in the working directory — the proven corpus
  of its earlier delivery — but on another stack, not the one this
  cell provides. The wish from `{{INPUT}}/brief.md`: the same service,
  the same law — on this cell's stack. Run the migration by
  submissions into the corpus under the printed contract: the same
  behaviors with their ids, new rows for the new stack; the verdict
  must stand over the rewritten product.
brimstack-solo: |
  The brief lives at `{{INPUT}}/brief.md` — the only input. A working
  product on another stack stands in the working directory; you want
  the same service under the same law on this cell's stack — rewrite
  it and prove the equivalence yourself, with your own checklist. The
  report is the file `report.md`: every brief requirement and its
  status (done / partial / no) in your own words.
